# Blueprint: web + Postgres. Render allows only ONE free Postgres per account — if sync fails,
# remove the `databases:` block and set DATABASE_URL manually (Internal URL) on amora-backend.
#
# Data persistence requires Postgres (not SQLite). SQLite on the web disk is ephemeral and resets IDs.

databases:
  - name: amora-db
    plan: free
    databaseName: amora
    user: amora

services:
  - type: web
    name: amora-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Optional override; settings.py also allows all *.onrender.com when RENDER=true
      - key: ALLOWED_HOSTS
        value: 127.0.0.1,localhost
      # Comma-separated. Include every browser origin that calls this API (Render static, GitHub Pages, etc.).
      # Local http://localhost:3000 and :5173 are added in settings.py automatically.
      # Example with GitHub Pages: https://amora-frontend.onrender.com,https://YOURUSER.github.io
      - key: CORS_ALLOWED_ORIGINS
        value: https://amora-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://amora-backend.onrender.com,https://amora-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: amora-db
          property: connectionString

  # Static sites must use type: web + runtime: static (not type: static).
  - type: web
    name: amora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # Relative to repository root (not rootDir). Build output is frontend/dist.
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        sync: false
      - key: CI
        value: "true"
