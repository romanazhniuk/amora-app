# Injects the API origin at build time (required for GitHub Pages: no localhost backend).
# Add repository secret VITE_API_URL with your HTTPS backend URL (Settings → Secrets and variables → Actions).
name: Frontend build

on:
  push:
    branches: [backend, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # If VITE_API_URL secret is unset, do not export empty VITE_API_URL (would override .env.production).
      - name: Build
        env:
          SECRET_VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -n "$SECRET_VITE_API_URL" ]; then
            export VITE_API_URL="$SECRET_VITE_API_URL"
          fi
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
