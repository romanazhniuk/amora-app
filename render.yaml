services:
  - type: web
    name: amora-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT amora_backend.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: amora-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://amora-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://amora-backend.onrender.com,https://amora-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: amora-db
          property: connectionString

  # Static sites must use type: web + runtime: static (not type: static).
  - type: web
    name: amora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # Relative to repository root (not rootDir). Build output is frontend/dist.
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        sync: false
      - key: CI
        value: "true"

databases:
  - name: amora-db
    plan: free
