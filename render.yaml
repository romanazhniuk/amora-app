services:
  - type: web
    name: amora-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn amora_backend.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: amora-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://amora-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://amora-backend.onrender.com,https://amora-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: amora-db
          property: connectionString

  - type: static
    name: amora-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        sync: false
      - key: CI
        value: "true"

databases:
  - name: amora-db
    plan: free
